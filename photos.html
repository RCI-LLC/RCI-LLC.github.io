<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Photos from Red Cap Industrial LLC construction projects." />
    <title>Photos | Red Cap Industrial, LLC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell page-shell--stacked">
      <header class="topbar">
        <a class="brand" href="index.html" aria-label="Red Cap Industrial LLC home">
          <span class="brand-mark">RCI</span>
          <span class="brand-text">Red Cap Industrial, LLC</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="index.html#home">Home</a>
          <a href="about.html">About</a>
          <a href="photos.html">Photos</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>
 
      <main id="photos-page">
        <section class="section" id="photos">
          <div class="section-heading">
            <h2>A look at our project work.</h2>
          </div>
          <div class="photo-grid">
            <figure class="photo-card">
              <div class="photo-frame"><img src="working.jpg" alt="Crew setting posts on site with heavy equipment" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>Project coordination</figcaption>
            </figure>
            <figure class="photo-card">
              <div class="photo-frame"><img src="beforeafter.jpg" alt="Before and after photos of a renovated interior space" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>Closeout &amp; handover</figcaption>
            </figure>
            <figure class="photo-card">
              <div class="photo-frame"><img src="concrete.jpg" alt="Crew finishing a freshly poured concrete slab" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>Crew at work</figcaption>
            </figure>
            <figure class="photo-card">
              <div class="photo-frame"><img src="riverclub.jpg" alt="Aerial view of a commercial building addition under construction" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>General contracting</figcaption>
            </figure>
            <figure class="photo-card">
              <div class="photo-frame"><img src="repairs.jpg" alt="Excavator clearing and repairing a site roadway" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>Hurricane Clean-up</figcaption>
            </figure>
            <figure class="photo-card">
              <div class="photo-frame"><img src="finished.jpg" alt="Completed metal building exterior" loading="lazy" onclick="openLightbox(this)" /></div>
              <figcaption>Finished space</figcaption>
            </figure>
          </div>
        </section>
      </main>
 
      <footer class="footer">
        <p>&copy; 2026 Red-Cap Industrial, LLC. All rights reserved.</p>
      </footer>
    </div>
 
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
      <button class="lightbox-close" type="button" aria-label="Close" onclick="closeLightbox(event)">&times;</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    </div>
 
    <script>
      function openLightbox(imgEl) {
        var lightbox = document.getElementById("lightbox");
        var lightboxImg = document.getElementById("lightbox-img");
        lightboxImg.src = imgEl.src;
        lightboxImg.alt = imgEl.alt;
        lightbox.classList.add("is-open");
        document.body.style.overflow = "hidden";
      }
 
      function closeLightbox(e) {
        // Only close if the click was on the overlay background, the close
        // button, or the Escape key — not on the enlarged image itself.
        if (e.type === "click" && e.target.id === "lightbox-img") return;
        var lightbox = document.getElementById("lightbox");
        lightbox.classList.remove("is-open");
        document.body.style.overflow = "";
      }
 
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeLightbox(e);
      });
    </script>
  </body>
</html>
